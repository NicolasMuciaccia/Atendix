<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & text" subtitle="Semantic aliases used by components" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--white);padding:20px 24px;color:var(--text-body)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle)}.cap{font-size:11px;color:var(--text-muted)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.s{height:84px;border-radius:10px;border:1px solid var(--border-subtle);padding:10px;display:flex;flex-direction:column;justify-content:space-between}.s b{font-size:13px;font-weight:600}.s span{font-family:var(--font-mono);font-size:9.5px}</style></head><body><div class="g"><div class="s" style="background:var(--bg-app)"><b style="color:var(--text-strong)">Aa strong</b><span style="color:var(--text-muted)">--bg-app</span></div><div class="s" style="background:var(--surface-card)"><b style="color:var(--text-body)">Aa body</b><span style="color:var(--text-muted)">--surface-card</span></div><div class="s" style="background:var(--surface-message)"><b style="color:var(--text-muted)">Aa muted</b><span style="color:var(--text-muted)">--surface-message</span></div><div class="s" style="background:var(--surface-selected)"><b style="color:var(--text-link)">Aa link</b><span style="color:var(--text-muted)">--surface-selected</span></div><div class="s" style="background:var(--surface-inverse);border-color:transparent"><b style="color:#fff">Aa inverse</b><span style="color:var(--text-inverse-muted)">--surface-inverse</span></div></div></body></html>
