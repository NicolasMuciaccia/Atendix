<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--white);padding:20px 24px;color:var(--text-body)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle)}.cap{font-size:11px;color:var(--text-muted)}body{background:var(--bg-app)}.r{display:flex;gap:18px;padding:8px 4px}.b{flex:1;height:96px;background:#fff;border-radius:12px;border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:10px}</style></head><body><div class="r"><div class="b" style="box-shadow:var(--shadow-xs)"><span class="mono">shadow-xs</span></div><div class="b" style="box-shadow:var(--shadow-sm)"><span class="mono">shadow-sm</span></div><div class="b" style="box-shadow:var(--shadow-md)"><span class="mono">shadow-md</span></div><div class="b" style="box-shadow:var(--shadow-lg)"><span class="mono">shadow-lg</span></div><div class="b" style="box-shadow:var(--shadow-xl)"><span class="mono">shadow-xl</span></div></div></body></html>
