<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--white);padding:20px 24px;color:var(--text-body)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle)}.cap{font-size:11px;color:var(--text-muted)}.r{display:flex;gap:18px}.c{display:flex;flex-direction:column;align-items:center;gap:8px}.b{width:72px;height:64px;background:var(--blue-50);border:1.5px solid var(--blue-300)}</style></head><body><div class="r"><div class="c"><div class="b" style="border-radius:4px;"></div><span class="mono">xs · 4</span><span class="cap">chips</span></div><div class="c"><div class="b" style="border-radius:6px;"></div><span class="mono">sm · 6</span><span class="cap">selects</span></div><div class="c"><div class="b" style="border-radius:8px;"></div><span class="mono">md · 8</span><span class="cap">buttons</span></div><div class="c"><div class="b" style="border-radius:10px;"></div><span class="mono">lg · 10</span><span class="cap">cards</span></div><div class="c"><div class="b" style="border-radius:14px;"></div><span class="mono">xl · 14</span><span class="cap">panels</span></div><div class="c"><div class="b" style="border-radius:20px;"></div><span class="mono">2xl · 20</span><span class="cap">feature</span></div><div class="c"><div class="b" style="border-radius:50%;width:64px"></div><span class="mono">full · full</span><span class="cap">avatars</span></div></div></body></html>
