<!-- @dsCard group="Colors" viewport="700x140" name="Ink neutrals" subtitle="Navy-tinted grays for text, borders and surfaces" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--white);padding:20px 24px;color:var(--text-body)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle)}.cap{font-size:11px;color:var(--text-muted)}.scale{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle)}.st{flex:1;height:96px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:11px}.st b{font-weight:600}.st span{font-family:var(--font-mono);font-size:10px;opacity:.8}</style></head><body><div class="scale"><div class="st" style="background:var(--ink-50);color:var(--ink-900)"><b>50</b><span>#F7F9FC</span></div><div class="st" style="background:var(--ink-100);color:var(--ink-900)"><b>100</b><span>#EEF1F7</span></div><div class="st" style="background:var(--ink-150);color:var(--ink-900)"><b>150</b><span>#E8ECF4</span></div><div class="st" style="background:var(--ink-200);color:var(--ink-900)"><b>200</b><span>#DEE3EE</span></div><div class="st" style="background:var(--ink-300);color:var(--ink-900)"><b>300</b><span>#C4CAD8</span></div><div class="st" style="background:var(--ink-400);color:#fff"><b>400</b><span>#97A0B5</span></div><div class="st" style="background:var(--ink-500);color:#fff"><b>500</b><span>#6A7590</span></div><div class="st" style="background:var(--ink-600);color:#fff"><b>600</b><span>#4F5B76</span></div><div class="st" style="background:var(--ink-700);color:#fff"><b>700</b><span>#36435E</span></div><div class="st" style="background:var(--ink-900);color:#fff"><b>900</b><span>#101F3C</span></div></div></body></html>
