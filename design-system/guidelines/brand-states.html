<!-- @dsCard group="Brand" viewport="700x150" name="Interaction states" subtitle="Hover = subtle fill, press = scale .98, focus = 3px blue ring" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--white);padding:20px 24px;color:var(--text-body)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle)}.cap{font-size:11px;color:var(--text-muted)}.r{display:flex;gap:14px}.c{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.btn{height:34px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;font-size:13px;font-weight:600}</style></head><body><div class="r"><div class="c"><span class="btn" style="background:var(--navy-900);color:#fff">Rest</span><span class="mono">navy-900</span></div><div class="c"><span class="btn" style="background:var(--navy-800);color:#fff">Hover</span><span class="mono">navy-800</span></div><div class="c"><span class="btn" style="background:var(--navy-950);color:#fff;transform:scale(.98)">Press</span><span class="mono">scale .98</span></div><div class="c"><span class="btn" style="background:#fff;color:var(--ink-800);border:1px solid var(--blue-500);box-shadow:var(--focus-ring)">Focus</span><span class="mono">--focus-ring</span></div><div class="c"><span class="btn" style="background:var(--surface-selected);color:var(--ink-900);position:relative;padding-left:16px"><i style="position:absolute;left:0;top:6px;bottom:6px;width:2.5px;border-radius:2px;background:var(--blue-500)"></i>Selected</span><span class="mono">blue-50 + bar</span></div><div class="c"><span class="btn" style="background:var(--navy-900);color:#fff;opacity:.45">Disabled</span><span class="mono">opacity .45</span></div></div></body></html>
