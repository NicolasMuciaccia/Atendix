<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--white);padding:20px 24px;color:var(--text-body)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle)}.cap{font-size:11px;color:var(--text-muted)}.g{display:grid;grid-template-columns:repeat(12,1fr);gap:8px}.i{height:44px;border-radius:8px;background:var(--ink-50);display:flex;align-items:center;justify-content:center}.i img{width:20px;height:20px;opacity:.75}</style></head><body><div class="g"><div class="i" title="inbox"><img src="../assets/icons/inbox.svg" alt="inbox"></div><div class="i" title="mail"><img src="../assets/icons/mail.svg" alt="mail"></div><div class="i" title="ticket"><img src="../assets/icons/ticket.svg" alt="ticket"></div><div class="i" title="at-sign"><img src="../assets/icons/at-sign.svg" alt="at-sign"></div><div class="i" title="user"><img src="../assets/icons/user.svg" alt="user"></div><div class="i" title="users"><img src="../assets/icons/users.svg" alt="users"></div><div class="i" title="archive"><img src="../assets/icons/archive.svg" alt="archive"></div><div class="i" title="chart-column"><img src="../assets/icons/chart-column.svg" alt="chart-column"></div><div class="i" title="clock"><img src="../assets/icons/clock.svg" alt="clock"></div><div class="i" title="smile"><img src="../assets/icons/smile.svg" alt="smile"></div><div class="i" title="map-pin"><img src="../assets/icons/map-pin.svg" alt="map-pin"></div><div class="i" title="calendar"><img src="../assets/icons/calendar.svg" alt="calendar"></div><div class="i" title="credit-card"><img src="../assets/icons/credit-card.svg" alt="credit-card"></div><div class="i" title="paperclip"><img src="../assets/icons/paperclip.svg" alt="paperclip"></div><div class="i" title="pen-line"><img src="../assets/icons/pen-line.svg" alt="pen-line"></div><div class="i" title="search"><img src="../assets/icons/search.svg" alt="search"></div><div class="i" title="sliders-horizontal"><img src="../assets/icons/sliders-horizontal.svg" alt="sliders-horizontal"></div><div class="i" title="ellipsis"><img src="../assets/icons/ellipsis.svg" alt="ellipsis"></div><div class="i" title="tag"><img src="../assets/icons/tag.svg" alt="tag"></div><div class="i" title="history"><img src="../assets/icons/history.svg" alt="history"></div><div class="i" title="send"><img src="../assets/icons/send.svg" alt="send"></div><div class="i" title="bell"><img src="../assets/icons/bell.svg" alt="bell"></div><div class="i" title="settings"><img src="../assets/icons/settings.svg" alt="settings"></div><div class="i" title="circle-check"><img src="../assets/icons/circle-check.svg" alt="circle-check"></div></div></body></html>
