<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--white);padding:20px 24px;color:var(--text-body)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle)}.cap{font-size:11px;color:var(--text-muted)}.r{display:flex;gap:28px}.c{display:flex;flex-direction:column;gap:10px}.c .l{font-size:11px;color:var(--text-subtle);font-weight:500}.c div{display:flex;gap:6px}</style></head><body><div class="r"><div class="c"><span class="l">Prioridade</span><div><span style="display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;background:var(--priority-high-bg);color:var(--priority-high-text);font-size:11px;font-weight:500">Alta</span><span style="display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;background:var(--priority-medium-bg);color:var(--priority-medium-text);font-size:11px;font-weight:500">Média</span><span style="display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;background:var(--priority-low-bg);color:var(--priority-low-text);font-size:11px;font-weight:500">Baixa</span></div></div><div class="c"><span class="l">Categoria</span><div><span style="display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;background:var(--tag-neutral-bg);color:var(--tag-neutral-text);font-size:11px;font-weight:500">Acesso à conta</span><span style="display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;background:var(--tag-violet-bg);color:var(--tag-violet-text);font-size:11px;font-weight:500">Faturamento</span><span style="display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;background:var(--tag-blue-bg);color:var(--tag-blue-text);font-size:11px;font-weight:500">Reembolso</span></div></div><div class="c"><span class="l">KPI tiles</span><div><span style="width:32px;height:32px;border-radius:8px;background:var(--tile-blue-bg);display:inline-flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:50%;background:var(--tile-blue-fg)"></span></span><span style="width:32px;height:32px;border-radius:8px;background:var(--tile-amber-bg);display:inline-flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:50%;background:var(--tile-amber-fg)"></span></span><span style="width:32px;height:32px;border-radius:8px;background:var(--tile-green-bg);display:inline-flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:50%;background:var(--tile-green-fg)"></span></span></div></div></div></body></html>
