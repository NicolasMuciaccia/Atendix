<!-- @dsCard group="Colors" viewport="700x140" name="Blue scale" subtitle="Brand accent — links, selection, active indicators" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--white);padding:20px 24px;color:var(--text-body)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle)}.cap{font-size:11px;color:var(--text-muted)}.scale{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle)}.st{flex:1;height:96px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:11px}.st b{font-weight:600}.st span{font-family:var(--font-mono);font-size:10px;opacity:.8}</style></head><body><div class="scale"><div class="st" style="background:var(--blue-50);color:var(--ink-900)"><b>50</b><span>#F3F6FF</span></div><div class="st" style="background:var(--blue-100);color:var(--ink-900)"><b>100</b><span>#E7EDFF</span></div><div class="st" style="background:var(--blue-200);color:var(--ink-900)"><b>200</b><span>#D0DBFF</span></div><div class="st" style="background:var(--blue-300);color:var(--ink-900)"><b>300</b><span>#90A4FF</span></div><div class="st" style="background:var(--blue-400);color:#fff"><b>400</b><span>#6381F8</span></div><div class="st" style="background:var(--blue-500);color:#fff"><b>500</b><span>#365DF5</span></div><div class="st" style="background:var(--blue-600);color:#fff"><b>600</b><span>#2A4CDB</span></div><div class="st" style="background:var(--blue-700);color:#fff"><b>700</b><span>#2240B5</span></div></div></body></html>
