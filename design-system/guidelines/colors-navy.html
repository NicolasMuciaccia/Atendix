<!-- @dsCard group="Colors" viewport="700x140" name="Navy scale" subtitle="Sidebar, primary buttons, inverse panels" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--white);padding:20px 24px;color:var(--text-body)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle)}.cap{font-size:11px;color:var(--text-muted)}.scale{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle)}.st{flex:1;height:96px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:11px}.st b{font-weight:600}.st span{font-family:var(--font-mono);font-size:10px;opacity:.8}</style></head><body><div class="scale"><div class="st" style="background:var(--navy-300);color:var(--ink-900)"><b>300</b><span>#B4BFD4</span></div><div class="st" style="background:var(--navy-400);color:var(--ink-900)"><b>400</b><span>#8D9BB8</span></div><div class="st" style="background:var(--navy-600);color:#fff"><b>600</b><span>#2E4672</span></div><div class="st" style="background:var(--navy-700);color:#fff"><b>700</b><span>#21365E</span></div><div class="st" style="background:var(--navy-800);color:#fff"><b>800</b><span>#172A4D</span></div><div class="st" style="background:var(--navy-900);color:#fff"><b>900</b><span>#101F3C</span></div><div class="st" style="background:var(--navy-950);color:#fff"><b>950</b><span>#0B1630</span></div></div></body></html>
