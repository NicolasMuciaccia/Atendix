<!-- @dsCard group="Colors" viewport="700x170" name="Semantic" subtitle="Positive, attention, danger, info — solid + soft pairs" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--white);padding:20px 24px;color:var(--text-body)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle)}.cap{font-size:11px;color:var(--text-muted)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.solid{height:44px;border-radius:10px 10px 0 0}.pair{height:32px;border-radius:0 0 10px 10px;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600}.n{font-size:12px;font-weight:600;color:var(--text-strong);margin-top:8px}</style></head><body><div class="g"><div class="sm"><div class="solid" style="background:var(--green-500)"></div><div class="pair" style="background:var(--positive-bg);color:var(--positive-text)">Resolvido</div><div class="n">Positive</div><div class="mono">#23A579</div></div><div class="sm"><div class="solid" style="background:var(--amber-500)"></div><div class="pair" style="background:var(--attention-bg);color:var(--attention-text)">Pendente</div><div class="n">Attention</div><div class="mono">#F4A340</div></div><div class="sm"><div class="solid" style="background:var(--red-500)"></div><div class="pair" style="background:var(--danger-bg);color:var(--danger-text)">Aberto · SLA</div><div class="n">Danger</div><div class="mono">#E5484D</div></div><div class="sm"><div class="solid" style="background:var(--blue-500)"></div><div class="pair" style="background:var(--info-bg);color:var(--info-text)">Novo</div><div class="n">Info</div><div class="mono">#365DF5</div></div></div></body></html>
