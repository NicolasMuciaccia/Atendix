<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--white);padding:20px 24px;color:var(--text-body)}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-subtle)}.cap{font-size:11px;color:var(--text-muted)}.row{display:grid;gap:10px}.sw .chip{height:64px;border-radius:10px}.sw .n{font-size:12px;font-weight:600;color:var(--text-strong);margin-top:8px}.row{grid-template-columns:repeat(4,1fr)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--navy-900)"></div><div class="n">Navy · navegação</div><div class="mono">#101F3C</div></div><div class="sw"><div class="chip" style="background:var(--blue-500)"></div><div class="n">Primary · ação</div><div class="mono">#365DF5</div></div><div class="sw"><div class="chip" style="background:var(--blue-300)"></div><div class="n">Secondary</div><div class="mono">#90A4FF</div></div><div class="sw"><div class="chip" style="background:var(--blue-50);border:1px solid var(--border-subtle)"></div><div class="n">Surface</div><div class="mono">#F3F6FF</div></div></div></body></html>
