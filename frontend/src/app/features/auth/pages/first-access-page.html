<div class="panel">
  <p class="wordmark">Atendix</p>

  <main class="card">
    <h1 class="title">Crie sua senha</h1>
    <p class="lead">
      Olá, {{ user()?.name }}. Você entrou com a senha inicial; defina uma senha pessoal para continuar.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (error()) {
        <p class="banner" role="alert">
          <atx-icon name="circle-alert" [size]="15" />
          {{ error() }}
        </p>
      }

      <atx-field label="Senha atual" for="current-password" hint="A senha inicial informada pelo administrador."
                 [error]="currentPasswordError()">
        <input id="current-password" class="atx-control" type="password" formControlName="currentPassword"
               autocomplete="current-password" aria-describedby="current-password-message"
               [attr.aria-invalid]="!!currentPasswordError()" />
      </atx-field>

      <atx-field label="Nova senha" for="new-password" [error]="newPasswordError()">
        <input id="new-password" class="atx-control" type="password" formControlName="newPassword"
               autocomplete="new-password" aria-describedby="new-password-message password-rules"
               [attr.aria-invalid]="!!newPasswordError()" />
      </atx-field>

      <ul class="rules" id="password-rules" aria-label="Requisitos da senha">
        @for (rule of rules(); track rule.label) {
          <li [class.met]="rule.met">
            <atx-icon [name]="rule.met ? 'circle-check' : 'circle-dot'" [size]="14" [strokeWidth]="2" />
            {{ rule.label }}
            <span class="visually-hidden">{{ rule.met ? '(atendido)' : '(pendente)' }}</span>
          </li>
        }
      </ul>

      <atx-field label="Confirmar nova senha" for="confirmation" [error]="confirmationError()">
        <input id="confirmation" class="atx-control" type="password" formControlName="confirmation"
               autocomplete="new-password" aria-describedby="confirmation-message"
               [attr.aria-invalid]="!!confirmationError()" />
      </atx-field>

      <button atxButton type="submit" size="lg" [fullWidth]="true" [loading]="submitting()">Salvar e continuar</button>
    </form>
  </main>

  <p class="footnote">
    Não é você?
    <button atxButton variant="ghost" size="sm" type="button" (click)="logout()">Sair</button>
  </p>
</div>
