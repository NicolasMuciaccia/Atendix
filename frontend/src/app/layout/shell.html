<aside class="sidebar" aria-label="Navegação principal">
  <a class="wordmark" routerLink="/chamados">Atendix</a>

  <nav class="nav">
    <a class="nav-item" routerLink="/chamados" routerLinkActive="active" ariaCurrentWhenActive="page">
      <atx-icon name="ticket" />
      Chamados
    </a>
    @if (isAdmin()) {
      <a class="nav-item" routerLink="/usuarios" routerLinkActive="active" ariaCurrentWhenActive="page">
        <atx-icon name="users" />
        Usuários
      </a>

      <p class="nav-group">Cadastros</p>
      <a class="nav-item" routerLink="/cadastros/setores" routerLinkActive="active" ariaCurrentWhenActive="page">
        <atx-icon name="building-2" />
        Setores
      </a>
      <a class="nav-item" routerLink="/cadastros/etiquetas" routerLinkActive="active" ariaCurrentWhenActive="page">
        <atx-icon name="tag" />
        Etiquetas
      </a>
      <a class="nav-item" routerLink="/cadastros/itens" routerLinkActive="active" ariaCurrentWhenActive="page">
        <atx-icon name="layers" />
        Itens
      </a>
    }
  </nav>

  @if (user(); as currentUser) {
    <div class="profile">
      <atx-avatar [name]="currentUser.name" [size]="34" />
      <div class="profile-text">
        <span class="profile-name">{{ currentUser.name }}</span>
        <span class="profile-role">{{ roleLabels[currentUser.role] }}</span>
      </div>
      <button atxIconButton variant="inverse" icon="log-out" label="Sair" type="button" (click)="logout()"></button>
    </div>
  }
</aside>

<main class="content">
  <router-outlet />
</main>

<nav class="bottom-nav" aria-label="Navegação principal">
  <a class="bottom-item" routerLink="/chamados" routerLinkActive="active" ariaCurrentWhenActive="page">
    <atx-icon name="ticket" [size]="22" />
    Chamados
  </a>
  <a class="fab" routerLink="/chamados" [queryParams]="{ novo: 1 }" aria-label="Novo chamado" title="Novo chamado">
    <atx-icon name="plus" [size]="22" [strokeWidth]="2.2" />
  </a>
  @if (isAdmin()) {
    <a class="bottom-item" routerLink="/cadastros" routerLinkActive="active" ariaCurrentWhenActive="page">
      <atx-icon name="layers" [size]="22" />
      Cadastros
    </a>
    <a class="bottom-item" routerLink="/usuarios" routerLinkActive="active" ariaCurrentWhenActive="page">
      <atx-icon name="users" [size]="22" />
      Usuários
    </a>
  }
  <button class="bottom-item" type="button" (click)="logout()">
    <atx-icon name="log-out" [size]="22" />
    Sair
  </button>
</nav>
