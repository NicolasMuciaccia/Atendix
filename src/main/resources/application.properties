# 1. identification
spring.application.name=atendix
spring.config.import=optional:file:.env[.properties]

# 2. database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.locations=classpath:db/migration

# 3. security
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=atendix
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=7d
app.security.cookie.secure=${COOKIE_SECURE:true}
app.security.cookie.same-site=Strict
app.security.argon2.salt-length=16
app.security.argon2.hash-length=32
app.security.argon2.parallelism=1
app.security.argon2.memory-kib=19456
app.security.argon2.iterations=2
app.security.login.max-failures=5
app.security.login.block-duration=15m
app.users.initial-password=mudar@123

# 4. web
spring.data.web.pageable.max-page-size=100

# 5. springdoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.default-models-expand-depth=-1
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.csrf.enabled=true
